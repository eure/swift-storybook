name: Build

on: [push]

jobs:
  build-storybook-kit:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "26.6"
      - uses: actions/checkout@v7
      - name: xcodebuild
        run: set -o pipefail && xcodebuild -scheme Storybook -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' | xcbeautify

  build-macos:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "26.6"
      - uses: actions/checkout@v7
      - name: Test native macOS package
        run: swift test
      - name: Build native macOS host bundle
        run: ./script/build_and_run.sh --build-only
