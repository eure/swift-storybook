name: Build

on: [push]

jobs:
  build-storybook-kit:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "26.6"
      - uses: actions/checkout@v7
      - name: xcodebuild
        run: set -o pipefail && xcodebuild -scheme Storybook -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' | xcbeautify

  build-macos:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "26.6"
      - uses: actions/checkout@v7
      - name: Test native macOS package
        run: swift test
      - name: Build native macOS host
        run: swift build --package-path Development/MacDemo
      - name: Build multiplatform demo for macOS
        run: xcodebuild -project Development/Storybook.xcodeproj -scheme SwiftUIDemoApp -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Build multiplatform demo for iOS
        run: xcodebuild -project Development/Storybook.xcodeproj -scheme SwiftUIDemoApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
