name: Build

on: [push]

jobs:
  build-storybook-kit:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "26.6"
      - uses: actions/checkout@v7
      - name: xcodebuild
        run: set -o pipefail && xcodebuild -scheme Storybook -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' | xcbeautify
